[project]
name = "khetkavach-api"
version = "0.1.0"
description = "KhetKavach API: field-level climate risk agent"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "sse-starlette>=2.1",
    "langgraph>=0.2.50",
    "google-genai>=1.0",
    "fastembed>=0.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.4",
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "pymupdf>=1.24",
    "python-dateutil>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
]
data = [
    "imdlib>=0.1.20",
    "xarray>=2024.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party packages that ship no type information
module = [
    "asyncpg.*", "pgvector.*", "rasterio.*", "pystac_client.*", "planetary_computer.*",
    "lightgbm.*", "joblib.*", "fastembed.*", "pymupdf.*", "fitz.*", "shapely.*", "pyproj.*",
    "sklearn.*", "imdlib.*", "xarray.*", "sse_starlette.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
