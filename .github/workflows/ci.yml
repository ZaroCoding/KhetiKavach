name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      # PostGIS + pgvector, built from the same Dockerfile as docker compose.
      - name: Start database
        working-directory: .
        run: |
          docker build -t khetkavach-db -f infra/db.Dockerfile .
          docker run -d --name khetkavach-db -p 5432:5432 \
            -e POSTGRES_USER=khetkavach -e POSTGRES_PASSWORD=ci-only-password \
            -e POSTGRES_DB=khetkavach khetkavach-db
          for i in $(seq 1 30); do
            docker exec khetkavach-db pg_isready -U khetkavach -d khetkavach && break
            sleep 2
          done
      - run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://khetkavach:ci-only-password@localhost:5432/khetkavach
      - run: uv run pytest
        env:
          DATABASE_URL: postgresql+psycopg://khetkavach:ci-only-password@localhost:5432/khetkavach

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

  docker:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t khetkavach-api apps/api
      - run: docker build -t khetkavach-web --build-arg NEXT_PUBLIC_API_URL=http://localhost:8080 apps/web
      - run: docker build -t khetkavach-db -f infra/db.Dockerfile .
